name: Returning Water Roster Godot Regression

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-regression:
    name: Godot 4.7.2 gameplay and scene regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Xvfb and Mesa software renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: Install Godot 4.7.2
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot-4.7.2.zip"
          install_dir="$RUNNER_TEMP/godot-4.7.2"
          mkdir -p "$install_dir"
          curl --fail --location --retry 3 \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            --output "$archive"
          unzip -q "$archive" -d "$install_dir"
          chmod +x "$install_dir/Godot_v4.7.2-stable_linux.x86_64"
          echo "GODOT_BIN=$install_dir/Godot_v4.7.2-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Verify Godot version
        run: |
          "$GODOT_BIN" --version
          "$GODOT_BIN" --version | grep -F '4.7.2'

      - name: Run touch-flow regression and scene smoke test
        run: scripts/test-returning-water-roster.sh "$RUNNER_TEMP/returning-water-roster-regression"

      - name: Upload machine-readable report, screenshots, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: returning-water-roster-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/returning-water-roster-regression/
          if-no-files-found: warn
          retention-days: 14
